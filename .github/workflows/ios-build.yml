name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Build GoJa (iOS 16+)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build GoJa for iOS Simulator
        run: |
          xcodebuild build \
            -project GoJa.xcodeproj \
            -scheme GoJa \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload GoJa.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoJa-iOS-Simulator-App
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/GoJa.app
