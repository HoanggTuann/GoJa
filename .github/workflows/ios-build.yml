name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build GoJa.ipa (Real iOS 16+)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build GoJa (Release - iphoneos)
        run: |
          xcodebuild build \
            -project GoJa.xcodeproj \
            -scheme GoJa \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/GoJa.app build/ipa/Payload/
          cd build/ipa
          zip -r -q GoJa.ipa Payload
          ls -lh GoJa.ipa

      - name: Upload GoJa.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoJa-iOS-IPA
          path: build/ipa/GoJa.ipa
